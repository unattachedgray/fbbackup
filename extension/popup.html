<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font: 13px system-ui, sans-serif; margin: 0; padding: 14px; color: #111; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 3px; font-weight: 600; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; }
    button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #1877f2; color: #fff; font-weight: 600; cursor: pointer; }
    .hint { color: #666; font-size: 11px; margin-top: 4px; line-height: 1.4; }
    #st { margin-top: 8px; font-size: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>📥 fbbackup scanner</h1>
  <label>Import endpoint</label>
  <input id="endpoint" placeholder="http://localhost:9119">
  <label>Token (X-Weftbase-Token)</label>
  <input id="token" placeholder="from ~/.hermes/weftbase-token">
  <div class="hint">Run <code>cat ~/.hermes/weftbase-token</code> and paste it here.</div>
  <button id="save">Save</button>
  <button id="test" style="background:#42b72a">Test connection</button>
  <div id="st"></div>
  <div class="hint" style="margin-top:10px">Then open your Facebook profile / activity log and click the blue <b>“Scan to fbbackup”</b> button, bottom-right, as you scroll.</div>
  <script src="popup.js"></script>
</body>
</html>
